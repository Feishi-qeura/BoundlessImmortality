schema_version: 1
project_id: rebuild-2026-10-24
kind: mapping-to-existing-interfaces-not-new-production-functions
shared_rules:
- Only transport subsystem creates/persists request_id; UI retains request identity
  and subject across refresh.
- Confirm binds exact actor/subject/quantity/cost/version/service day; re-evaluate
  at click.
- Unknown display field cannot block unrelated or native-valid requests; unknown actual
  action entitlement never defaults allowed.
- Viewer AssistTribulation remains verified live-comment actor/event path; no anchor
  self-assist button.
- Root alone owns receipt dequeue; page outcome back has no grant/claim side effect.
