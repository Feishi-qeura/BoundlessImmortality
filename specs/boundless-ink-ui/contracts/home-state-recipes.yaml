schema_version: 1
project_id: boundless-ink-ui
source_asset_id: home-v2
status: specified-not-engine-implemented
controls:
- id: home-control-activity
  art:
  - home-top-tile
  - home-icon-activity
  label: 活动
  action: OpenActivities
  states:
  - id: normal
    art_mode: shared-base-textures
    render_recipe: &id001
      tint:
      - 1
      - 1
      - 1
      - 1
      translation:
      - 0
      - 0
      scale: 1
      focus: false
      submit_enabled: true
  - id: hover
    art_mode: shared-base-textures
    render_recipe: &id002
      tint:
      - 0.92
      - 0.98
      - 1
      - 1
      translation:
      - 0
      - 0
      scale: 1
      overlay: blue-ink-at-0.12
      duration_ms: 120
      desktop_only: true
  - id: pressed
    art_mode: shared-base-textures
    render_recipe: &id003
      tint:
      - 0.85
      - 0.85
      - 0.85
      - 1
      translation:
      - 0
      - 2
      scale: 1
      duration_ms: 80
  - id: focused
    art_mode: shared-base-textures
    render_recipe: &id004
      tint:
      - 1
      - 1
      - 1
      - 1
      translation:
      - 0
      - 0
      scale: 1
      outline: thin-aged-gold
      focus: true
  - id: selected
    art_mode: shared-base-textures
    render_recipe: &id005
      tint:
      - 1
      - 1
      - 1
      - 1
      translation:
      - 0
      - 0
      scale: 1
      outline: gold-selected-mark
      persists_until_selection_changes: true
  - id: disabled
    art_mode: shared-base-textures
    render_recipe: &id006
      tint:
      - 0.62
      - 0.62
      - 0.62
      - 0.7
      translation:
      - 0
      - 0
      scale: 1
      submit_enabled: false
      reason_visible: true
      label_contrast_min: 4.5
  - id: pending
    art_mode: shared-base-textures
    render_recipe: &id007
      tint:
      - 0.78
      - 0.78
      - 0.78
      - 0.9
      translation:
      - 0
      - 0
      scale: 1
      submit_enabled: false
      return_enabled: true
      show_progress: true
      retry_request: same-request-id
      success_only_from_authoritative_snapshot: true
  minimum_hit_size:
  - 88
  - 88
  label_font: LXGWWenKai
  label_is_dynamic: true
  event_dispatch: one release inside widget triggers one action; cancel drag or release outside
  runtime_implementation: not-created-this-stage
