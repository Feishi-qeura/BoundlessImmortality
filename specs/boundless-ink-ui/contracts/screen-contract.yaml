  visual_assets_status: pending-review
  runtime_logic_changes: false
screens:
- id: main
  legacy_screen_id: UI_MAIN
  name: 主菜单
  category: core
  priority: must-have
  status: preserved
  purpose: 保留启动页的水墨题字、人物与按钮构图
  entry_points:
  - application-start
  primary_actions:
  - 进入HUD
  dependencies: []
  route: Main
  current_status: existing_wbp_and_source_not_runtime_tested
  route_verification: planning-csv; inspect runtime alias before integration
  delivery: preserve-runtime
  profile_gate: base
  source_phase: UI-P1
  layout:
    top:
    - 标题、返回、作用对象与真实状态
    center:
    - 开始、继续、存档、设置、退出；沿用当前可达路径
    bottom:
    - 固定主操作与禁用理由
    floating:
    - 必要详情与确认；装饰不接收点击
  responsive:
    portrait: 720×1280单列列表→详情，标题与CTA固定，中段独立滚动
    landscape: 1280×720列表+详情；常规页右侧抽屉，密集页居中宽页
  components: []
  component_planning:
  - 功能页外壳
  - 带理由按钮
  - 状态条
  - 按业务选择奖励/成员/来源块
  states: &id001
  - default
  - loading
  - ready
  - empty
  - locked
  - pending
  - disconnected
  - error
  - expired
  - feature-disabled
  edge_cases:
  - 存档为空、继续不可用、退出确认
  - 不为参考图增设选服登录
  data_needs:
  - FrontendVm
  rules:
  - 保留现有启动页；导航清单见当前路由，缺项只登记
  output:
    brief: briefs/main.md
    prompt: ''
    image: ''
  approval:
    approved: false
    reason: 用户仅指定保留范围，未批准本轮新视觉
  current_route_aliases:
  - Main
  specification_approved: true
- id: home
  legacy_screen_id: UI_HUD
  name: 常驻HUD
  category: core
  priority: must-have
  status: approved
  purpose: 保留游戏首页HUD与相机，作为新页面的风格衔接基准
  entry_points:
  - main
  primary_actions:
  - 修炼或收功
